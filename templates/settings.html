{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Settings</h3>
<form id="settings-form" class="row g-3">
    <div class="col-md-4">
        <label class="form-label" for="syn_threshold">SYN Threshold</label>
        <input class="form-control" type="number" id="syn_threshold" name="syn_threshold" min="0" />
    </div>
    <div class="col-md-4">
        <label class="form-label" for="udp_threshold">UDP Threshold</label>
        <input class="form-control" type="number" id="udp_threshold" name="udp_threshold" min="0" />
    </div>
    <div class="col-md-4 form-check mt-4">
        <input class="form-check-input" type="checkbox" id="enable_ml" name="enable_ml" />
        <label class="form-check-label" for="enable_ml">Enable ML Classifier</label>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Save</button>
        <span class="text-success ms-3" id="settings-status"></span>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        window.settingsPage && window.settingsPage();
    });
</script>
{% endblock %}
